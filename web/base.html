{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VenueOps 会展场馆控制台</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f2f4f7; color: #1f2937; }
nav { background: #0f172a; color: #fff; padding: 12px 24px; display: flex; gap: 20px; align-items: center; }
nav a { color: #cbd5e1; text-decoration: none; padding: 6px 10px; border-radius: 4px; }
nav a.active, nav a:hover { background: #334155; color: #fff; }
main { padding: 24px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; }
.panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
input, select, button { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
button.secondary { background: #64748b; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; font-size: 14px; }
th { background: #f8fafc; }
code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
.muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<nav>
  <strong>VenueOps</strong>
  <a href="/halls" class="{{if eq .Active "halls"}}active{{end}}">展馆</a>
  <a href="/screens" class="{{if eq .Active "screens"}}active{{end}}">大屏</a>
  <a href="/lights" class="{{if eq .Active "lights"}}active{{end}}">灯光</a>
  <a href="/guards" class="{{if eq .Active "guards"}}active{{end}}">巡更</a>
</nav>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
